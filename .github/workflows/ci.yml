name: Smart Monitor CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-cpp-engine:
    name: Compile C++ Engine
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install g++ & Build Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      
      - name: Compile Engine
        working-directory: ./engine
        run: make

  test-nodejs-bridge:
    name: Verify Node.js Environment
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'bridge/package-lock.json'
          
      - name: Install Bridge Dependencies
        working-directory: ./bridge
        run: npm ci

      - name: Install Dashboard Dependencies
        working-directory: ./dashboard
        run: npm install # Using install instead of ci in case package-lock isn't committed

  docker-dry-run:
    name: Multi-Stage Docker Build
    runs-on: ubuntu-22.04
    needs: [build-cpp-engine, test-nodejs-bridge] # Only run if code compiles
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # We are just testing the build, not pushing to a registry
          tags: smart-monitor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Size
        run: |
          IMAGE_SIZE=$(docker images --format "{{.Size}}" smart-monitor:latest)
          echo "Built Image Size: $IMAGE_SIZE"